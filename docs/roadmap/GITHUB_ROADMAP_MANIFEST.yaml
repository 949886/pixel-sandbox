manifest_version: 1
project: Pixel Piece World
purpose: GitHub roadmap planning manifest; no GitHub objects have been created.
rules:
  title_policy: Issue 标题仅使用任务名称，不包含版本号、type、area 或 priority 前缀。
  milestone_policy: 版本号只通过 Milestone 表达。
  label_policy: 任务类型、领域、优先级通过 Labels 表达。
  max_issue_depth: 4
  v5_0_scope_guard: 不能明显改善 New Game → Explore → Fight → Loot → Build Wand → Special Room → Boss → End 的任务，默认不属于 V5.0 blocker。
  creation_policy: 先建 Roadmap/Milestone/System Epic；V5.0 逐步展开 concrete tasks，V5.1+ 接近开发时再展开。
labels:
- name: type:roadmap
  description: 跨多个版本的长期路线图
- name: type:epic
  description: 由多个子任务组成的系统级/版本级 Epic
- name: type:feature
  description: 独立功能
- name: type:content
  description: 敌人、Boss、房间、Biome 等内容
- name: type:tech
  description: 架构、性能、Native、平台技术任务
- name: type:bug
  description: 缺陷修复
- name: type:balance
  description: 数值、掉落、难度、经济、手感
- name: area:run
  description: Game 生命周期与进度
- name: area:world
  description: 世界、Encounter、房间、Biome
- name: area:enemy
  description: 敌人与 AI
- name: area:combat
  description: 战斗规则与反馈
- name: area:loot
  description: 掉落、奖励、经济、Pickup
- name: area:wand
  description: Wand 系统
- name: area:spell
  description: Spell/Cast/Modifier
- name: area:material
  description: 材质 Gameplay
- name: area:ui
  description: Gameplay UI
- name: area:creative
  description: Creative Sandbox/开发工具
- name: area:native
  description: fallingsand Native
- name: area:platform
  description: 平台覆盖与设备 profiling
- name: priority:P0
  description: 阻塞当前 Milestone 发布
- name: priority:P1
  description: 当前 Milestone 强烈需要
- name: priority:P2
  description: 有价值的后续增强
- name: priority:P3
  description: 长期 backlog / nice-to-have
milestones:
- id: ms-v5.0
  title: V5.0 — First Playable Game
  status: current
  objective: 完成第一条从 New Game 到 Mine Boss / Victory 的完整可玩 Game。
- id: ms-v5.1
  title: V5.1 — Wand & Material Gameplay
  status: planned
  objective: 深化 Wand 构筑，并让 Spell 更系统地操纵像素环境。
- id: ms-v5.2
  title: V5.2 — Snow Biome Gameplay
  status: planned
  objective: 把 Snow 做到与 Mine 同等级的第二个完整 Gameplay Biome。
- id: ms-v5.3
  title: V5.3 — Creative Developer Toolkit
  status: planned
  objective: 把 Creative Mode 提升为高效率 Gameplay 开发与复现工具。
- id: ms-v5.4
  title: V5.4 — Engine & Platform Hardening
  status: planned
  objective: 在 Gameplay Loop 稳定后系统处理性能、稳定性和平台覆盖。
- id: ms-v6.0
  title: V6.0 — World & Progression Expansion
  status: future
  objective: 扩展 Deep、多 Biome Run、Elite、更多 Boss 与世界进度。
- id: ms-v6.1
  title: V6.1 — Meta Progression
  status: tentative
  objective: 仅在基础 Game 已被证明好玩后评估局外成长。
issues:
- id: roadmap-alpha
  title: Gameplay Alpha Roadmap
  parent: null
  milestone: null
  labels:
  - type:roadmap
  summary: 把当前像素模拟 + Wand/Spell + Creative + 基础 Combat 原型推进为完整 Gameplay Alpha，并追踪 V5.x–V6.x 主线。
  children:
  - first-playable-run
  - wand-material-gameplay
  - snow-biome-gameplay
  - creative-developer-toolkit
  - engine-platform-hardening
  - world-progression-expansion
  - meta-progression
  blocked_by: []
  definition_of_done:
  - V5.0 完成第一条完整 Run
  - V5.1 完成 Wand/Material 深化
  - V5.2 完成第二个完整 Biome
  - 完成 Alpha stabilization / release candidate
  non_goals: []
- id: first-playable-run
  title: First Playable Game
  parent: roadmap-alpha
  milestone: ms-v5.0
  labels:
  - type:epic
  - area:run
  - priority:P0
  summary: 让玩家从 New Game 开始，在 Mine 中探索、战斗、Loot、构筑 Wand、进入 Special Room、击败 Boss，并以死亡或 Victory 正式结束一局。
  children:
  - run-foundation
  - wand-loot-generation
  - mine-enemy-set
  - special-rooms-economy
  - mine-boss-exit
  - alpha-balance-pass
  - basic-dig-resistance
  blocked_by: []
  definition_of_done:
  - New Game → Explore → Fight → Loot → Build Wand → Special Room → Boss → Death/Victory 全链路成立
  - 死亡真正结束 Normal Run，Restart 创建干净新 Run
  - 奖励能改变 Build，Gold 有用途
  - 至少 5 类正式 Mine 敌人
  - Treasure / Shrine / Shop 可用
  - 至少 1 个正式 Boss 和 Exit/Victory
  - Creative 不参与 Normal progression
  - 完整 Game 不依赖开发者手工摆放关键奖励
  non_goals:
  - 完整 Snow Biome
  - Meta Progression
  - 高级 Trigger/Timer Spell
  - Creative Terrain Undo
  - 所有 Sand Material Gameplay 化
- id: run-foundation
  title: Game Foundation
  parent: first-playable-run
  milestone: ms-v5.0
  labels:
  - type:epic
  - area:run
  - priority:P0
  summary: 建立正式 Game 生命周期、死亡、重启、结算和 Session 清理。
  children:
  - run-manager-state
  - run-death-restart
  - run-ui-summary
  - session-reset
  blocked_by: []
  definition_of_done:
  - Game 有明确状态机
  - 死亡与 Restart 链路完整
  - 新 Game 不继承上一局 runtime 状态
  non_goals: []
- id: run-manager-state
  title: GameManager and Game State
  parent: run-foundation
  milestone: ms-v5.0
  labels:
  - type:feature
  - area:run
  - priority:P0
  summary: 建立 GameManager 管理 seed、biome、depth、elapsed time、boss/special-room state 与统计。
  children: []
  blocked_by: []
  definition_of_done:
  - 支持 STARTING / PLAYING / TRANSITION / PLAYER_DEAD / VICTORY
  - Game 有唯一 seed
  - 状态切换通过 signal 暴露
  - GameManager 不接管 PlayerInventory/WandController/HealthComponent
  - Normal 与 Creative Session 分离
  non_goals: []
- id: run-death-restart
  title: Game Death and Restart Flow
  parent: run-foundation
  milestone: ms-v5.0
  labels:
  - type:feature
  - area:run
  - area:combat
  - priority:P0
  summary: 把 Normal Mode 测试 Respawn 改成真正 Game Death；Creative 保留测试友好行为。
  children: []
  blocked_by:
  - run-manager-state
  definition_of_done:
  - HP<=0 后禁用 Gameplay 输入
  - 进入 PLAYER_DEAD
  - 有 Restart/Quit 流程
  - Restart 创建新 Run
  - Creative 测试流程不受破坏
  non_goals: []
- id: run-ui-summary
  title: Game Start, Death, Victory and Summary UI
