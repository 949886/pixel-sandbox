  children: []
  blocked_by:
  - run-manager-state
  definition_of_done:
  - 至少显示 Depth、Gold、Elapsed Time、Enemies Killed、Wands/Spells Collected
  - 固定 UI 在 .tscn，脚本只处理逻辑/绑定
  non_goals: []
- id: session-reset
  title: Clean Session Reset
  parent: run-foundation
  milestone: ms-v5.0
