  children: []
  blocked_by:
  - run-manager-state
  definition_of_done:
  - 重置 World seed/Chunks/Gold/Inventory/Wands/Status/Boss/Special Rooms
  - 清理旧 Projectiles/Pickups/Enemies
  - Creative 临时状态不泄漏到 Normal
