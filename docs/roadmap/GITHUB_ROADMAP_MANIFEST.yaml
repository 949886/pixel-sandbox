manifest_version: 2
project: Pixel Piece World
terminology: {manager: GameManager, state: GameState, session: Game, area: 'area:gameplay', preserve: [Runtime, Long-run]}
schema: {gh: github_issue, p: parent, m: milestone, l: labels, b: blocked_by}
rules: {title: 'plain task name', version: milestone, metadata: labels, max_depth: 4, v5_scope: 'New Game → Explore → Fight → Loot → Build Wand → Special Room → Boss → End'}
labels: ['type:roadmap', 'type:epic', 'type:feature', 'type:content', 'type:tech', 'type:bug', 'type:balance', 'area:gameplay', 'area:world', 'area:enemy', 'area:combat', 'area:loot', 'area:wand', 'area:spell', 'area:material', 'area:ui', 'area:creative', 'area:native', 'area:platform', 'priority:P0', 'priority:P1', 'priority:P2', 'priority:P3']
milestones:
  ms-v5.0: {title: 'V5.0 — First Playable Game', status: current}
  ms-v5.1: {title: 'V5.1 — Wand & Material Gameplay', status: planned}
  ms-v5.2: {title: 'V5.2 — Snow Biome Gameplay', status: planned}
  ms-v5.3: {title: 'V5.3 — Creative Developer Toolkit', status: planned}
  ms-v5.4: {title: 'V5.4 — Engine & Platform Hardening', status: planned}
  ms-v6.0: {title: 'V6.0 — World & Progression Expansion', status: future}
  ms-v6.1: {title: 'V6.1 — Meta Progression', status: tentative}
